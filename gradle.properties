# Memory and JVM Performance
# Lowered from 6g/3g. If your laptop has 16 GB+ RAM and builds are not swapping, you can raise these again.
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseG1GC

# Gradle Execution Optimization
org.gradle.parallel=true
org.gradle.caching=true
# Changed from false. If Gradle reports configuration cache problems, set this back to false.
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true

# Fast Kotlin & Compiler Optimizations
kotlin.compiler.execution.strategy=daemon
kotlin.incremental=true
kotlin.incremental.multiplatform=true
kotlin.daemon.useFallbackStrategy=false
kotlin.parallel.tasks.in.project=true
ksp.incremental=true
ksp.incremental.intermodule=true

# Android Gradle Plugin Optimizations
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.enableR8.fullMode=true

# REMOVED (deprecated, they were showing as warnings in your Build Output):
#   kotlin.incremental.useClasspathSnapshot=true
#   android.bundle.enableUncompressedNativeLibs=true
#   android.enableDexingArtifactTransform=true

# OPTIONAL: debug only for your phone (arm64). Uncomment, sync Gradle,
# then choose "arm64FossDebug" in Build Variants for the :app module.
# enableAbiSplits=true

# Disable Crashlytics Automatic Build ID Generation in Debug
firebaseCrashlytics.buildId.enabled=false

# Flow Neuroengine
FLOW_NEURO_BASE_URL=https://api.flowneuroengine.com
FLOW_NEURO_API_KEY=dummy_key

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
